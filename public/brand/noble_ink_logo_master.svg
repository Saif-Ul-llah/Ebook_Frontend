<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" style="stop-color:#EDE8E0"/>
      <stop offset="100%" style="stop-color:#E0D9CF"/>
    </radialGradient>
    <radialGradient id="bk1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#B0B8C4;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#B0B8C4;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="bk2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#C4A0A0;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#C4A0A0;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- Bokeh circles -->
  <circle cx="200" cy="238" r="130" fill="url(#bk1)"/>
  <circle cx="192" cy="230" r="88" fill="none" stroke="#9AAABB" stroke-width="1" opacity="0.3"/>
  <circle cx="808" cy="720" r="148" fill="url(#bk2)"/>
  <circle cx="798" cy="710" r="100" fill="none" stroke="#C4A0A0" stroke-width="1" opacity="0.25"/>
  <circle cx="820" cy="195" r="82" fill="url(#bk1)" opacity="0.6"/>

  <!-- PEN ICON -->
  <g transform="translate(500, 228)">
    <!-- Red eraser cap -->
    <rect x="-24" y="-96" width="48" height="18" rx="8" fill="#C0392B" opacity="0.88"/>
    <!-- Metal ferrule -->
    <rect x="-24" y="-80" width="48" height="10" rx="2" fill="#8899AA" opacity="0.45"/>
    <!-- Navy pen body -->
    <rect x="-24" y="-70" width="48" height="110" rx="5" fill="#1C3B6E"/>
    <!-- Highlight -->
    <rect x="-16" y="-66" width="12" height="100" rx="3" fill="white" opacity="0.09"/>
    <!-- Grip section -->
    <rect x="-24" y="32" width="48" height="16" rx="3" fill="#152D55"/>
    <!-- Red nib cone -->
    <path d="M-24 48 L24 48 L4 94 L-4 94 Z" fill="#C0392B" opacity="0.9"/>
    <!-- Nib tip -->
    <polygon points="0,94 -4,87 4,87" fill="#8B1A1A"/>
    <!-- Ink thread from nib tip -->
    <line x1="0" y1="97" x2="0" y2="148" stroke="#9AAABB" stroke-width="1.2" opacity="0.55"/>
    <!-- Ink dot -->
    <circle cx="0" cy="154" r="4" fill="#9AAABB" opacity="0.5"/>
  </g>

  <!-- NOBLE -->
  <text x="500" y="548"
        font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
        font-size="148"
        font-weight="900"
        fill="#1C3B6E"
        text-anchor="middle"
        letter-spacing="10">NOBLE</text>

  <!-- Hairline rules around INK -->
  <line x1="80" y1="572" x2="430" y2="572" stroke="#9AAABB" stroke-width="0.8" opacity="0.55"/>
  <line x1="570" y1="572" x2="920" y2="572" stroke="#9AAABB" stroke-width="0.8" opacity="0.55"/>

  <!-- INK -->
  <text x="500" y="672"
        font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
        font-size="130"
        font-weight="900"
        fill="#C0392B"
        text-anchor="middle"
        letter-spacing="22">INK</text>

  <!-- Rule below INK -->
  <line x1="80" y1="692" x2="920" y2="692" stroke="#9AAABB" stroke-width="0.8" opacity="0.4"/>

  <!-- STUDIOS -->
  <text x="500" y="762"
        font-family="Arial, sans-serif"
        font-size="38"
        font-weight="400"
        fill="#5A7080"
        text-anchor="middle"
        letter-spacing="22">STUDIOS</text>

  <!-- Tagline -->
  <text x="500" y="840"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#8899AA"
        text-anchor="middle"
        letter-spacing="5">YOUR STORY. EXPERTLY TOLD.</text>

  <!-- Bottom rule -->
  <line x1="0" y1="968" x2="1000" y2="968" stroke="#9AAABB" stroke-width="2" opacity="0.4"/>
</svg>